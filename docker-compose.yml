version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: career_intel_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: career_intelligence
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: career_intel_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: career_intel_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgrespassword@db:5432/career_intelligence
      - ENVIRONMENT=production
      - DEBUG=false
      - SECRET_KEY=production-secure-key-minimum-32-chars-long-2026
      - CORS_ORIGINS=["http://localhost", "http://localhost:5173", "http://localhost:3000"]
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
      - reports_data:/app/reports_generated

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: career_intel_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
  uploads_data:
  reports_data:
